<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎃 Halloween Alphabet Generator</title>
<meta name="description" content="Generator huruf dengan animasi ngocok bertema Halloween. Huruf disembunyikan, diacak, lalu muncul besar dan menetap." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@300;400;600&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- dekorasi terbang -->
<div class="decor" id="decor" aria-hidden="true"></div>

<header class="site-header">
  <h1 class="logo"><span class="bob">🎃</span> Alphabet Generator <span class="bob">🦇</span></h1>
  <p class="tagline">Hurufnya disembunyikan — diacak dulu, baru muncul 👻</p>
</header>

<main class="app">

  <!-- Papan: huruf besar di tengah + baris tile ngocok -->
  <section class="board">
    <div class="stage">
      <span class="letter-big idle" id="bigLetter" aria-hidden="true">?</span>
    </div>

    <div class="grid" id="grid" aria-hidden="true"></div>
  </section>

  <!-- Panel aksi -->
  <section class="panel">
    <button type="button" class="btn-pick" id="btnPick">
      🎲 Acak Huruf
    </button>

    <p class="hint">atau tekan <kbd>Spasi</kbd></p>

    <label class="switch">
      <input type="checkbox" id="toggleSound" checked />
      <span class="track"></span>
      <span>Bunyi "klek" saat huruf muncul</span>
    </label>
  </section>

</main>

<footer class="site-footer">
  <span class="sr-only" id="result" aria-live="polite">—</span>
  <p>Total acak: <strong id="count">0</strong> 🕷️</p>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
